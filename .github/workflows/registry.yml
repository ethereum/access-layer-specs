name: registry

on:
  pull_request:
    paths:
      - 'specs/**'
      - 'scripts/build_registry.py'
      - 'registry.yaml'
      - 'README.md'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: front matter and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Validate front matter and check generated files are current
        run: python3 scripts/build_registry.py --check
